<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craftify Email Verification</title>
<style>
    body {
    font-family: Arial, sans-serif;
    background-color: #f6f6f6;
    color: #333333;
    margin: 0;
    padding: 0;
}
    .container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    background-color: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
}
    .header {
    background-color: #3d85c6;
    padding: 20px;
    text-align: center;
    color: #ffffff;
}
    .header h1 {
    margin: 0;
}
    .content {
    padding: 20px;
}
    .content p {
    margin: 0 0 20px;
}
    .content a {
    display: inline-block;
    background-color: #ff7900;
    color: #ffffff;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 5px;
}
    .footer {
    background-color: #f6f6f6;
    padding: 10px;
    text-align: center;
    color: #999999;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Welcome to Craftify!</h1>
    </div>
    <div class="content">
        <p>Dear {{name}},</p>
        <p>Thank you for signing up for Craftify! Please verify your email address by clicking the button below:</p>
        <button type="submit"><a href="{{verificationUrl}}">Verify Email</a></button>
        <p>If you did not sign up for Craftify, please ignore this email.</p>
        <p>Best regards,<br>The Craftify Team</p>
    </div>
    <div class="footer">
        <p>&copy; 2024 Craftify. All rights reserved.</p>
    </div>
</div>
</body>
</html>
